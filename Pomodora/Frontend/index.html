<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Seethos</title>
  <link rel="stylesheet" href="css/index.css" />
</head>
<body>
  <div class="dashboard-container">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo-container">
          <div class="logo"><span class="logo-letter">S</span></div>
          <span class="logo-text">eethos</span>
        </div>
        <button class="sidebar-toggle" id="sidebarToggle" title="Toggle Sidebar">
          <svg width="16" height="16" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <line x1="9" y1="9" x2="9" y2="15"/>
          </svg>
        </button>
      </div>

      <nav class="sidebar-nav">
        <ul class="nav-list">
          <li class="nav-item">
            <a href="pages/dashboard.html" class="nav-link active" data-page="dashboard">
              <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" stroke="currentColor">
                <rect x="3" y="3" width="7" height="7"/>
                <rect x="14" y="3" width="7" height="7"/>
                <rect x="14" y="14" width="7" height="7"/>
                <rect x="3" y="14" width="7" height="7"/>
              </svg>
              <span class="nav-text">Dashboard</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="pages/cameras.html" class="nav-link" data-page="cameras">
              <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" stroke="currentColor">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                <circle cx="12" cy="13" r="4"/>
              </svg>
              <span class="nav-text">Cameras</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="pages/live.html" class="nav-link" data-page="live">
              <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" stroke="currentColor">
                <circle cx="12" cy="12" r="2"/>
                <path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"/>
              </svg>
              <span class="nav-text">Live Feed</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="pages/alerts.html" class="nav-link" data-page="alerts">
              <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" stroke="currentColor">
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                <line x1="12" y1="9" x2="12" y2="13"/>
                <line x1="12" y1="17" x2="12.01" y2="17"/>
              </svg>
              <span class="nav-text">Alerts</span>
            </a>
          </li>
        </ul>
      </nav>
    </aside>
              
    <!-- Main Content -->
    <main class="main-content">
      <header class="top-header">
        <div class="header-left">
          <button class="mobile-menu-toggle" id="mobileMenuToggle">
            <svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor">
              <line x1="3" y1="6" x2="21" y2="6"/>
              <line x1="3" y1="12" x2="21" y2="12"/>
              <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>
        </div>
        <div class="header-right">
          <div class="header-item">
            <button class="notification-btn" id="notificationBtn">
              <svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
              </svg>
              <span class="notification-badge">1</span>
            </button>
          </div>
          <div class="header-item user-menu">
            <button class="user-btn" id="userBtn">
              <div class="user-avatar">
                <svg width="16" height="16" viewBox="0 0 24 24" stroke="currentColor">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                  <circle cx="12" cy="7" r="4"/>
                </svg>
              </div>
            </button>
            <div class="user-dropdown" id="userDropdown">
              <div class="user-info">
                <div class="user-name">Admin User</div>
                <div class="user-email">admin@seethos.com</div>
              </div>
              <div class="dropdown-divider"></div>
              <ul class="dropdown-menu">
                <li><a href="#" class="dropdown-item">Profile</a></li>
                <li><a href="#" class="dropdown-item">Account Settings</a></li>
                <li><a href="#" class="dropdown-item">Security</a></li>
                <li class="dropdown-divider"></li>
                <li><a href="#" class="dropdown-item">Sign Out</a></li>
              </ul>
            </div>
          </div>
        </div>
      </header>

      <!-- Dynamic Page Content -->
      <div class="page-content" id="pageContent">
        <div class="content-loading">
          <div class="loading-spinner"></div>
          <p>Loading...</p>
        </div>
      </div>
    </main>
  </div>

  <div class="overlay" id="overlay"></div>

  <!-- Script -->
  <script src="js/index.js" defer></script>
</body>
</html>
